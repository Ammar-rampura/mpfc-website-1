<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%">
  <!-- Transparent background, pixel-accurate reproduction of MPFC official emblem -->
  <!-- Red Capsule Badge -->
  <path d="M 40 40 L 320 40 C 390 40, 420 85, 420 135 C 420 185, 390 230, 320 230 L 40 230 Z" fill="#b80c1d"/>

  <!-- Bold Modern Sans Lettering (MPF) -->
  <!-- M -->
  <path d="M 58 60 H 92 L 115 158 L 138 60 H 172 V 210 H 140 V 110 L 123 182 H 107 L 90 110 V 210 H 58 Z" fill="#ffffff"/>
  
  <!-- P -->
  <path d="M 188 60 H 262 C 298 60, 316 80, 316 112 C 316 144, 298 164, 262 164 H 222 V 210 H 188 Z M 222 88 V 136 H 258 C 274 136, 282 128, 282 112 C 282 96, 274 88, 258 88 Z" fill="#ffffff"/>

  <!-- F with wheel integration -->
  <path d="M 326 60 H 388 V 88 H 358 V 120 H 384 V 148 H 358 V 210 H 326 Z" fill="#ffffff"/>

  <!-- 3D Angled Red & White Tyre Rim / Wheel (Replaces C) -->
  <g transform="translate(378, 136)">
    <!-- Red 3D Depth back ring -->
    <path d="M -16 -80 C 18 -80, 42 -40, 42 0 C 42 40, 18 80, -16 80 C -32 80, -42 56, -42 0 C -42 -56, -32 -80, -16 -80 Z" fill="#8a0713"/>
    
    <!-- White Main Rim Outer Ring -->
    <path d="M -22 -82 C 12 -82, 36 -42, 36 0 C 36 42, 12 82, -22 82 C -36 82, -45 58, -45 0 C -45 -58, -36 -82, -22 -82 Z" fill="#ffffff"/>
    
    <!-- Inner Dark Void / Tyre Bed -->
    <path d="M -20 -66 C 4 -66, 22 -34, 22 0 C 22 34, 4 66, -20 66 C -31 66, -37 46, -37 0 C -37 -46, -31 -66, -20 -66 Z" fill="#b80c1d"/>
    
    <!-- Inner Hub Rim (White) -->
    <ellipse cx="-16" cy="0" rx="14" ry="46" fill="#ffffff"/>
    <ellipse cx="-18" cy="0" rx="9" ry="36" fill="#8a0713"/>
    
    <!-- Cog/Tread notches on the inner circle -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <line x1="-12" y1="-32" x2="-8" y2="-28"/>
      <line x1="-10" y1="-20" x2="-5" y2="-17"/>
      <line x1="-9" y1="-8" x2="-4" y2="-6"/>
      <line x1="-9" y1="6" x2="-4" y2="4"/>
      <line x1="-10" y1="18" x2="-5" y2="15"/>
      <line x1="-12" y1="30" x2="-8" y2="26"/>
    </g>
  </g>

  <!-- Subtitle Text -->
  <text x="230" y="246" text-anchor="middle" fill="#d21527" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" letter-spacing="0.6">Madhya Pradesh Freight Carrier</text>
</svg>
